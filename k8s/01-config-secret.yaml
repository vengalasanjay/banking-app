# ── ConfigMap: non-sensitive DB config ────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-config
  namespace: banking-poc
data:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "bankingdb"
  DB_USER: "root"

---
# ── Secret: sensitive values (base64 encoded) ─────────────────────────────────
# To re-encode: echo -n "yourpassword" | base64
# rootpassword  → cm9vdHBhc3N3b3Jk
# change-me-jwt → Y2hhbmdlLW1lLWp3dA==
apiVersion: v1
kind: Secret
metadata:
  name: banking-secret
  namespace: banking-poc
type: Opaque
data:
  DB_PASS:    cm9vdHBhc3N3b3Jk
  JWT_SECRET: Y2hhbmdlLW1lLWp3dA==
