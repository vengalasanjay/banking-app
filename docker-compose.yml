version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bankingdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: banking-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: bankingdb
      DB_USER: root
      DB_PASS: rootpassword
      JWT_SECRET: local-dev-secret
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app   # hot reload during dev

  frontend:
    build: ./frontend
    container_name: banking-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      # Points to the backend service name inside docker-compose network
      BACKEND_URL: http://backend:5000

volumes:
  mysql-data: